name: Validate competition image
on: [push, pull_request, workflow_dispatch]
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -v
      # [ASTRA_ENHANCEMENT_2026-11-21] Compare against the officially scored parent.
      - run: python scripts/compare_policy.py e24fcdad447c5ebdec006774e6c28cd1d492e290
      - run: docker build --platform linux/amd64 -t mechroyale-agent .
      - name: Official checker under competition sandbox
        run: >-
          python official/mechfight-kit/check/check.py --map-dir /arena --
          docker run --rm -i --network none --cpus 1 --memory 512m
          --memory-swap 512m --pids-limit 128 --cap-drop ALL
          --read-only --tmpfs /tmp:rw,size=64m --user 65534:65534
          -v "$PWD/official/mechfight-kit/arena:/arena:ro" mechroyale-agent
